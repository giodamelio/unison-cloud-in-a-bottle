name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # TODO: add ubuntu-24.04-arm back once the initial aarch64 push from nixbuild.net is done.
        runner: [ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      # cloud-api's Haskell build doesn't fit in the runner's default free space.
      - uses: mathio/gha-cleanup@aca3d43a05bf564f5fc69acb929a65b01797f22b # v1.1.2
        with:
          remove-browsers: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # Pushes every path as it's built, so a cancelled run still keeps what it finished.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: unison-cloud-in-a-bottle
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # push-cache's script references every package and the demo VM, so building it builds all of them.
      - name: Build packages and demo VM
        run: nix build --print-build-logs .#push-cache

  list-checks:
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - id: list
        run: echo "checks=$(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  # The checks are NixOS VM tests, which need KVM, so they only run on x86_64. They wait
  # for the build job so they pull its packages from Cachix instead of each rebuilding them.
  check:
    needs: [build, list-checks]
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.list-checks.outputs.checks) }}
    runs-on: ubuntu-latest
    steps:
      - uses: mathio/gha-cleanup@aca3d43a05bf564f5fc69acb929a65b01797f22b # v1.1.2
        with:
          remove-browsers: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: unison-cloud-in-a-bottle
          skipPush: true

      - name: Run ${{ matrix.check }}
        run: nix build --print-build-logs .#checks.x86_64-linux.${{ matrix.check }}
